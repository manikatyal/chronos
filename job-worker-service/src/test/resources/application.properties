spring.datasource.url=jdbc:h2:mem:workerdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.listener.auto-startup=false
chronos.worker.reports.output-directory=${java.io.tmpdir}/job-worker-test-reports
chronos.worker.security.jwt-secret=test-worker-jwt-secret-at-least-32-chars-long
chronos.worker.backdoor.internal-key=test-internal-key
chronos.worker.allowed-origins=http://localhost:5173
