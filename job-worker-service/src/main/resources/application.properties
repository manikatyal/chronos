spring.application.name=job-worker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/job_worker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:job-worker}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.port=8088

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

chronos.worker.security.jwt-secret=${CHRONOS_JWT_SECRET}
chronos.worker.allowed-origins=${CHRONOS_ALLOWED_ORIGINS:http://localhost:5173}
management.health.mail.enabled=false

chronos.worker.topic.job-execution=${CHRONOS_WORKER_JOB_EXECUTION_TOPIC:job-execution}
chronos.worker.email.from-address=${CHRONOS_WORKER_EMAIL_FROM:${MAIL_USERNAME:}}
chronos.worker.news.india-headlines-url=${CHRONOS_WORKER_NEWS_INDIA_HEADLINES_URL:https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en}
chronos.worker.news.gold-price-url=${CHRONOS_WORKER_NEWS_GOLD_PRICE_URL:https://news.google.com/rss/search?q=gold%20price&hl=en-IN&gl=IN&ceid=IN:en}
chronos.worker.news.stock-updates-url=${CHRONOS_WORKER_NEWS_STOCK_UPDATES_URL:https://news.google.com/rss/search?q=nifty%2050%20stock%20market&hl=en-IN&gl=IN&ceid=IN:en}
chronos.worker.endpoints.notification=${CHRONOS_WORKER_NOTIFICATION_ENDPOINT:http://127.0.0.1:5174/notifications}
chronos.worker.endpoints.news=${CHRONOS_WORKER_NEWS_ENDPOINT:http://127.0.0.1:5174/news}
chronos.worker.endpoints.payment=${CHRONOS_WORKER_PAYMENT_ENDPOINT:}
chronos.worker.endpoints.order=${CHRONOS_WORKER_ORDER_ENDPOINT:}
chronos.worker.endpoints.hotel=${CHRONOS_WORKER_HOTEL_ENDPOINT:}
chronos.worker.endpoints.sync=${CHRONOS_WORKER_SYNC_ENDPOINT:}
chronos.worker.backdoor.scheduler-failure-endpoint=${CHRONOS_WORKER_SCHEDULER_FAILURE_ENDPOINT:http://127.0.0.1:8087/internal/worker-failures}
chronos.worker.backdoor.failed-jobs-endpoint=${CHRONOS_WORKER_FAILED_JOBS_ENDPOINT:http://127.0.0.1:8087/internal/failed-jobs}
chronos.worker.backdoor.internal-key=${CHRONOS_WORKER_INTERNAL_KEY}
chronos.worker.backdoor.worker-id=${CHRONOS_WORKER_ID:${spring.application.name}}
chronos.worker.reports.output-directory=${CHRONOS_WORKER_REPORTS_OUTPUT_DIRECTORY:generated-reports}
