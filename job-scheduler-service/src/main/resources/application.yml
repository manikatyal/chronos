spring:
  application:
    name: job-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_scheduler}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

chronos:
  scheduler:
    batch-size: ${CHRONOS_SCHEDULER_BATCH_SIZE:50}
    lease-duration: ${CHRONOS_SCHEDULER_LEASE_DURATION:30s}
    poll-interval-ms: ${CHRONOS_SCHEDULER_POLL_INTERVAL_MS:1000}
    retry-gap: ${CHRONOS_SCHEDULER_RETRY_GAP:30s}
    cron-retry-gap: ${CHRONOS_SCHEDULER_CRON_RETRY_GAP:2m}
  security:
    jwt-secret: ${CHRONOS_JWT_SECRET}
    jwt-ttl-seconds: ${CHRONOS_JWT_TTL_SECONDS:86400}
    bootstrap-admin-user-id: ${CHRONOS_BOOTSTRAP_ADMIN_USER_ID:admin}
    bootstrap-admin-password: ${CHRONOS_BOOTSTRAP_ADMIN_PASSWORD:}
  rate-limit:
    enabled: ${CHRONOS_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${CHRONOS_RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    window-seconds: ${CHRONOS_RATE_LIMIT_WINDOW_SECONDS:60}
  internal:
    worker-report-key: ${CHRONOS_INTERNAL_WORKER_REPORT_KEY}
