spring.datasource.url=jdbc:h2:mem:jobscheduler;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=localhost:9092

chronos.scheduler.batch-size=10
chronos.scheduler.lease-duration=30s
chronos.scheduler.poll-interval-ms=1000
chronos.scheduler.retry-gap=30s
chronos.scheduler.cron-retry-gap=2m
chronos.security.jwt-secret=test-jwt-secret-123456789
chronos.security.jwt-ttl-seconds=86400
chronos.security.bootstrap-admin-user-id=test-admin
chronos.security.bootstrap-admin-password=test-admin-pass
chronos.rate-limit.enabled=false
chronos.rate-limit.requests-per-minute=1000
chronos.rate-limit.window-seconds=60
spring.task.scheduling.enabled=false
