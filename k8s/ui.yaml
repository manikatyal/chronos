apiVersion: v1
kind: Service
metadata:
  name: ui
spec:
  selector:
    app: ui
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      enableServiceLinks: false
      containers:
        - name: ui
          # nginx serves the SPA and proxies /api/scheduler, /api/worker and /ws to the services above.
          image: chronos-ui
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 20m
            limits:
              memory: 64Mi
