# Only the UI is exposed; it proxies the APIs and the WebSocket internally.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chronos
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
