apiVersion: v1
kind: Service
metadata:
  name: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - port: 8087
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
spec:
  # Two replicas on purpose: leases claimed with FOR UPDATE SKIP LOCKED keep them from double-dispatching.
  replicas: 2
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      enableServiceLinks: false
      containers:
        - name: scheduler
          image: chronos-scheduler
          ports:
            - containerPort: 8087
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/job_scheduler
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: chronos-secrets, key: DB_PASSWORD }
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: CHRONOS_RATE_LIMIT_ENABLED
              value: "true"
            - name: CHRONOS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef: { name: chronos-config, key: PUBLIC_ORIGIN }
            - name: CHRONOS_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: chronos-secrets, key: CHRONOS_JWT_SECRET }
            - name: CHRONOS_INTERNAL_WORKER_REPORT_KEY
              valueFrom:
                secretKeyRef: { name: chronos-secrets, key: CHRONOS_INTERNAL_KEY }
            - name: CHRONOS_BOOTSTRAP_ADMIN_USER_ID
              value: admin
            - name: CHRONOS_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: chronos-secrets, key: CHRONOS_BOOTSTRAP_ADMIN_PASSWORD, optional: true }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8087 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            periodSeconds: 20
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 640Mi
