name: chronos

services:
  postgres:
    image: postgres:16-alpine
    container_name: chronos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: chronos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnami/kafka:3.7
    container_name: chronos-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_NUM_PARTITIONS: 1
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
      KAFKA_KRAFT_CLUSTER_ID: MDEyMzQ1Njc4OWFiY2RlZg
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  scheduler:
    build:
      context: ./job-scheduler-service
    container_name: chronos-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/job_scheduler
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      CHRONOS_RATE_LIMIT_ENABLED: "true"
      CHRONOS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5175,http://localhost:5176
      CHRONOS_JWT_SECRET: chronos-local-jwt-secret
      CHRONOS_INTERNAL_WORKER_REPORT_KEY: chronos-local-internal-key
      CHRONOS_BOOTSTRAP_ADMIN_USER_ID: admin
      CHRONOS_BOOTSTRAP_ADMIN_PASSWORD: admin12345
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./job-worker-service
    container_name: chronos-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      scheduler:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/job_worker
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHRONOS_WORKER_JOB_EXECUTION_TOPIC: job-execution
      CHRONOS_WORKER_INTERNAL_KEY: chronos-local-internal-key
      CHRONOS_WORKER_SCHEDULER_FAILURE_ENDPOINT: http://scheduler:8087/internal/worker-failures
      CHRONOS_WORKER_FAILED_JOBS_ENDPOINT: http://scheduler:8087/internal/failed-jobs
      CHRONOS_WORKER_ID: job-worker
      CHRONOS_WORKER_EMAIL_FROM: chronos-local@localhost
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/actuator/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ui:
    build:
      context: ./job-console-ui
    container_name: chronos-ui
    depends_on:
      scheduler:
        condition: service_started
      worker:
        condition: service_started
    ports:
      - "5173:80"

volumes:
  postgres_data:
